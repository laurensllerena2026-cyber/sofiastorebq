<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Sofía Store</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><a class="logo" href="index.html">Sofía<b>Store</b></a><nav style="display:flex"><a href="index.html">Volver a la tienda</a></nav></header>
<main class="sec">
<section id="login" class="stack">
  <h2>Ingreso admin</h2>
  <label>Usuario <input id="u" autocomplete="username"></label>
  <label>Contraseña <input id="p" type="password" autocomplete="current-password"></label>
  <button class="btn" id="go">Entrar</button><p id="lErr" role="alert"></p>
</section>
<section id="panel" hidden>
  <h2>Mensajes recibidos</h2><div id="msgs"></div>
  <h2>Productos</h2>
  <form id="add" class="row">
    <label>Nombre <input id="n" required></label>
    <label>Precio <input id="pr" type="number" min="0" required></label>
    <label>Categoría <select id="ca"><option value="Ropa">Ropa</option><option value="Zapatos">Zapatos</option><option value="Bolsos">Bolsos</option></select></label>
    <label>Foto (ej: img/prenda7.jpeg) <input id="im"></label>
    <label>Ocasión <select id="oc"><option>casual</option><option>elegante</option><option>playa</option></select></label>
    <button class="btn" type="submit">Agregar</button>
  </form>
  <p id="pErr" role="alert"></p>
  <div id="plist"></div>
  <button class="btn ghost" id="out">Cerrar sesión</button>
</section>
</main>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const token=()=>sessionStorage.getItem("ss_token");
// Habla con el servidor; si el token no sirve, cierra la sesión
async function api(path,opts={}){
  let r;
  try{
    r=await fetch(API_URL+path,{...opts,headers:{"Content-Type":"application/json",...(token()?{Authorization:"Bearer "+token()}:{})}});
  }catch(e){throw new Error("No se pudo conectar con el servidor. ¿Está encendido?")}
  const data=await r.json().catch(()=>({}));
  if(r.status===401&&path!=="/api/login"){sessionStorage.removeItem("ss_token");show();throw new Error("Tu sesión terminó. Entra de nuevo.")}
  if(!r.ok)throw new Error(data.error||"Ocurrió un error");
  return data;
}
function show(){const ok=!!token();$("login").hidden=ok;$("panel").hidden=!ok;if(ok)draw()}
$("go").onclick=async()=>{
  $("lErr").textContent="Entrando...";
  try{
    const d=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("u").value.trim(),password:$("p").value})});
    sessionStorage.setItem("ss_token",d.token);$("p").value="";$("lErr").textContent="";show();
  }catch(e){$("lErr").textContent=e.message}
};
$("out").onclick=()=>{sessionStorage.removeItem("ss_token");show()};
async function draw(){
  try{
    const [msgs,prods]=await Promise.all([api("/api/messages"),api("/api/products")]);
    $("msgs").innerHTML=msgs.length?msgs.map(x=>`<div class="note"><b>${esc(x.name)}</b> (${esc(x.contact)}) · ${esc(new Date(x.date).toLocaleString("es-CO"))}<p>${esc(x.msg)}</p></div>`).join(""):"<p>Aún no hay mensajes.</p>";
    $("plist").innerHTML=prods.map(p=>`<div class="note"><span><b>${esc(p.name)}</b> · ${esc(p.cat)}</span><span><input type="number" min="0" value="${Number(p.price)}" data-price="${esc(p._id)}" style="width:120px" aria-label="Precio de ${esc(p.name)}"> <button class="btn small" data-save="${esc(p._id)}">Guardar precio</button> <button class="btn small ghost" data-del="${esc(p._id)}">Eliminar</button></span></div>`).join("");
  }catch(e){$("pErr").textContent=e.message}
}
$("plist").onclick=async e=>{
  const s=e.target.dataset.save,d=e.target.dataset.del;
  try{
    if(s){const v=+document.querySelector(`[data-price="${s}"]`).value;await api("/api/products/"+s,{method:"PUT",body:JSON.stringify({price:v})});$("pErr").textContent="Precio actualizado."}
    if(d&&confirm("¿Eliminar este producto?")){await api("/api/products/"+d,{method:"DELETE"});$("pErr").textContent="Producto eliminado.";draw()}
  }catch(err){$("pErr").textContent=err.message}
};
$("add").onsubmit=async e=>{
  e.preventDefault();
  try{
    await api("/api/products",{method:"POST",body:JSON.stringify({name:$("n").value.trim(),price:+$("pr").value,cat:$("ca").value,tags:[$("oc").value],img:$("im").value.trim(),desc:"Nuevo en la tienda."})});
    e.target.reset();$("pErr").textContent="Producto agregado.";draw();
  }catch(err){$("pErr").textContent=err.message}
};
show();
</script></body></html>
